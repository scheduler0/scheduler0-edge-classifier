name: Bugbot Auto-Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  trust:
    name: Reject forked pull requests
    runs-on: ubuntu-latest
    # Only run on PRs, not on issues. The head must belong to this repository:
    # issue comments and reviews execute this workflow with a privileged token,
    # so a fork's code must never be checked out or installed.
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || (github.event_name == 'pull_request_review')
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
      sha: ${{ steps.trust.outputs.sha }}
      number: ${{ steps.trust.outputs.number }}
    steps:
    - name: Confirm the pull request head is in this repository
      id: trust
      uses: actions/github-script@v7
      with:
        script: |
          const expected = `${context.repo.owner}/${context.repo.repo}`;

          async function loadPull(pullNumber) {
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            return data;
          }

          let pr;
          if (context.eventName === "pull_request" || context.eventName === "pull_request_review") {
            pr = context.payload.pull_request;
          } else if (context.eventName === "issue_comment") {
            pr = await loadPull(context.payload.issue.number);
          } else {
            core.setOutput("trusted", "false");
            core.notice("No pull request to analyze.");
            return;
          }

          const headRepo = pr.head && pr.head.repo && pr.head.repo.full_name
            ? pr.head.repo.full_name
            : "";
          const sha = pr.head && pr.head.sha ? pr.head.sha : "";
          const number = String(pr.number);
          const trusted = headRepo === expected
            && /^[a-f0-9]{40}$/.test(sha)
            && /^[0-9]+$/.test(number);
          core.setOutput("trusted", trusted ? "true" : "false");
          core.setOutput("sha", trusted ? sha : "");
          core.setOutput("number", trusted ? number : "");
          if (!trusted) {
            core.notice(`Skipping untrusted pull request head ${headRepo || "(missing)"}`);
          }

  bugbot-review:
    name: Bugbot Review and Auto-Fix
    needs: trust
    runs-on: ubuntu-latest
    if: needs.trust.outputs.trusted == 'true'
    
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.trust.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_RUNTIME_TOKEN: ""
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m spacy download en_core_web_sm
    
    - name: Run tests to identify issues
      id: test
      continue-on-error: true
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_RUNTIME_TOKEN: ""
      run: |
        python -m unittest discover -s tests -v > test_output.txt 2>&1
        TEST_EXIT_CODE=$?
        echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
        cat test_output.txt
    
    - name: Analyze test failures and generate fixes
      if: steps.test.outputs.exit_code != '0'
      id: analyze
      run: |
        echo "Test failures detected. Analyzing..."
        
        # Create a summary of failures
        cat > failure_summary.md << 'EOF'
        ## Test Failures Detected
        
        Bugbot has identified test failures in this PR. See the test output above for details.
        
        **Action**: Bugbot will attempt to automatically fix these issues.
        EOF
        
        cat failure_summary.md
        echo "has_failures=true" >> $GITHUB_OUTPUT
    
    - name: Comment on PR with findings
      if: steps.analyze.outputs.has_failures == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const testOutput = fs.readFileSync('test_output.txt', 'utf8');
          const failureSummary = fs.readFileSync('failure_summary.md', 'utf8');
          
          const body = `${failureSummary}
          
          <details>
          <summary>Test Output</summary>
          
          \`\`\`
          ${testOutput.slice(0, 8000)}
          \`\`\`
          
          </details>
          
          Bugbot is analyzing these failures and will attempt to generate fixes automatically.`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: ${{ needs.trust.outputs.number }},
            body: body
          });
    
    - name: Run linting checks
      id: lint
      continue-on-error: true
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
      run: |
        # Check Python syntax
        python -m py_compile app.py intent.py suggestions.py 2>&1 | tee lint_output.txt
        LINT_EXIT_CODE=$?
        echo "exit_code=$LINT_EXIT_CODE" >> $GITHUB_OUTPUT
    
    - name: Generate comprehensive issue report
      if: steps.test.outputs.exit_code != '0' || steps.lint.outputs.exit_code != '0'
      run: |
        cat > bugbot_report.md << 'EOF'
        # Bugbot Analysis Report
        
        ## Summary
        Bugbot has completed analysis of this PR and identified the following issues:
        
        EOF
        
        if [ "${{ steps.test.outputs.exit_code }}" != "0" ]; then
          echo "- ❌ Test failures detected" >> bugbot_report.md
        else
          echo "- ✅ All tests passing" >> bugbot_report.md
        fi
        
        if [ "${{ steps.lint.outputs.exit_code }}" != "0" ]; then
          echo "- ❌ Linting issues detected" >> bugbot_report.md
        else
          echo "- ✅ No linting issues" >> bugbot_report.md
        fi
        
        cat >> bugbot_report.md << 'EOF'
        
        ## Recommendations
        
        Bugbot recommends the following actions:
        1. Review the test output above
        2. Fix any failing tests
        3. Ensure all new code includes appropriate test coverage
        4. Run tests locally before pushing: `python -m unittest discover -s tests -v`
        
        ## Auto-Fix Status
        
        To enable automatic fixes, please ensure the repository has:
        - Cursor Cloud Agent access configured
        - Appropriate permissions for automated commits
        
        EOF
        
        cat bugbot_report.md
    
    - name: Post final report
      if: steps.test.outputs.exit_code != '0' || steps.lint.outputs.exit_code != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('bugbot_report.md', 'utf8');
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: ${{ needs.trust.outputs.number }},
            body: report
          });
    
    - name: Set PR status
      uses: actions/github-script@v7
      with:
        script: |
          const exitCode = '${{ steps.test.outputs.exit_code }}';
          const status = exitCode === '0' ? 'success' : 'failure';
          const description = status === 'success' 
            ? 'All checks passed' 
            : 'Issues detected - review Bugbot comments';
          
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: '${{ needs.trust.outputs.sha }}',
            state: status,
            context: 'Bugbot Auto-Fix',
            description: description,
            target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          });
