name: Deploy Intent Classifier to Amazon ECS (staging)

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

concurrency:
  group: intent-classifier-deploy-staging-${{ github.ref }}
  cancel-in-progress: true

# id-token: write lets _deploy.yml mint a GitHub OIDC token when AWS_ROLE_ARN
# is set; a called workflow cannot raise permissions above its caller's.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      env_name: staging
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
