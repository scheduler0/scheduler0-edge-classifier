name: Deploy Intent Classifier (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment (production or staging)"
        required: true
        type: string
      env_name:
        description: "Short environment name used to derive resource names (staging or production)"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Intent Classifier
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENV_NAME: ${{ inputs.env_name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Derive ECS resource names
      run: |
        set -euo pipefail
        echo "ECR_REPOSITORY=${ENV_NAME}-scheduler0-intent-classifier"                                >> "$GITHUB_ENV"
        echo "ECS_CLUSTER=${ENV_NAME}_scheduler0_ecs_cluster"                                         >> "$GITHUB_ENV"
        echo "ECS_SERVICE=${ENV_NAME}_scheduler0-intent-classifier-service"                           >> "$GITHUB_ENV"
        echo "ECS_TASK_DEFINITION=${ENV_NAME}-scheduler0-intent-classifier-ecs-task-definition.json"  >> "$GITHUB_ENV"
        echo "CONTAINER_NAME=${ENV_NAME}-scheduler0-intent-classifier"                                >> "$GITHUB_ENV"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Get AWS Account ID
      id: aws-account
      run: |
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "account_id=${AWS_ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
        echo "AWS Account ID: ${AWS_ACCOUNT_ID}"

    - name: Generate task definition from template
      run: |
        set -euo pipefail
        TEMPLATE_FILE="${ENV_NAME}-scheduler0-intent-classifier-ecs-task-definition.template.json"
        OUTPUT_FILE="${ECS_TASK_DEFINITION}"
        
        if [ ! -f "${TEMPLATE_FILE}" ]; then
          echo "ERROR: Template file ${TEMPLATE_FILE} not found"
          exit 1
        fi
        
        echo "Generating ${OUTPUT_FILE} from ${TEMPLATE_FILE}"
        sed -e "s|<AWS_ACCOUNT_ID>|${{ steps.aws-account.outputs.account_id }}|g" \
            -e "s|<AWS_REGION>|${AWS_REGION}|g" \
            "${TEMPLATE_FILE}" > "${OUTPUT_FILE}"
        
        echo "Task definition generated successfully"
        cat "${OUTPUT_FILE}"

    # Runtime config comes from SSM / the task definition (Doppler syncs SSM
    # natively); the deploy needs nothing from Doppler, so the CLI is not installed.

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -euo pipefail

        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        IMAGE_URI_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

        docker build -t "${IMAGE_URI}" -t "${IMAGE_URI_LATEST}" .
        docker push "${IMAGE_URI}"
        docker push "${IMAGE_URI_LATEST}"

        echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}
        environment-variables: |
          ENV=${{ inputs.env_name }}

    - name: Register task definition
      id: register-task-def
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://${{ steps.task-def.outputs.task-definition }} \
          --region ${{ env.AWS_REGION }} \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        echo "TASK_DEF_ARN=${TASK_DEF_ARN}" >> "$GITHUB_ENV"
        echo "Task definition registered: ${TASK_DEF_ARN}"

    - name: Deploy to ECS
      run: |
        set -euo pipefail

        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --task-definition ${{ env.TASK_DEF_ARN }} \
          --region ${{ env.AWS_REGION }} \
          --query 'service.{ServiceName:serviceName,Status:status,TaskDefinition:taskDefinition}' \
          --output table

        # Wait up to 3 minutes for the service to stabilize.
        # The task runs on the shared scheduler0 EC2 node (the same instance as
        # scheduler0-private-1; Duckling + the NLP venv are baked into its golden
        # AMI), so placement is normally immediate. A timeout is still non-fatal:
        # the container health check has a 300 s start period, and CloudWatch
        # alarms are the authoritative signal for ongoing service health.
        echo "Waiting up to 3 min for service to stabilize (non-fatal if the EC2 node is still bootstrapping)..."
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --region ${{ env.AWS_REGION }} \
          --cli-read-timeout 180 \
          --cli-connect-timeout 10 && echo "Service stabilized." || {
            echo "::warning::Service did not stabilize within 3 min — task is pending (EC2 bootstrap may still be in progress)."
            aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Events:events[0:3]}' \
              --output json
          }

        echo "Image registered and service updated successfully."

    - name: Check ECS service status
      run: |
        aws ecs describe-services \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --query 'services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount,PendingCount:pendingCount}' \
          --output table

        aws ecs describe-services \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --query 'services[0].deployments[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount,PendingCount:pendingCount}' \
          --output table

    - name: Deployment troubleshooting info
      if: always()
      run: |
        echo "=== DEPLOYMENT TROUBLESHOOTING INFO ==="
        echo "1. Force new deployment:"
        echo "   aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment"
        echo "2. Check service events:"
        echo "   aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} --query 'services[0].events[0:5]'"
        echo "3. Check the node bootstrap log on the shared scheduler0 EC2 instance (over SSM):"
        echo "   tail -f /var/log/cloud-init-output.log"
        echo "4. Verify the node carries the placement attribute and Duckling is up:"
        echo "   grep ECS_INSTANCE_ATTRIBUTES /etc/ecs/ecs.config   # expects scheduler0.intent-classifier"
        echo "   systemctl status duckling; tail -20 /var/log/duckling.log"
        echo "5. Verify Duckling binary:"
        echo "   /opt/duckling/duckling-example-exe --help"
        echo "======================================"
