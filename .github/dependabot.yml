version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # spaCy bumps need a matching en_core_web_sm wheel, re-baselined
      # classifier tests, and a golden AMI rebuild. Do them by hand.
      # update-types does not apply to range pins like >=3.7.0,<3.8.0, so the
      # whole package is ignored.
      - dependency-name: spacy
