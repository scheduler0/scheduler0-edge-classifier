version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # spaCy minor bumps need a matching en_core_web_sm wheel, re-baselined
      # classifier tests, and a golden AMI rebuild. Do them by hand.
      - dependency-name: spacy
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
